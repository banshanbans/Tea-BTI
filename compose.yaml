name: tea-bti

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/tea-bti.db}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      AI_MODE: ${AI_MODE:-auto}
    volumes:
      - ./.data:/data
      - ./apps/api:/app/apps/api
      - ./assets:/app/assets:ro
      - ./packages/contracts:/app/packages/contracts
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./apps/web:/app/apps/web
      - ./packages/contracts:/app/packages/contracts
      - web_node_modules:/app/node_modules
      - web_next:/app/apps/web/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  web_node_modules:
  web_next:
